<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Market Shopping List</title>
    <link rel="stylesheet" href="style.css">
    <script src="./app.js"></script>
</head>
<body>

    <main class="container">
        <header>
            <h1>Addis Market</h1>
            <p>Interactive Shopping List</p>
        </header>

        <section class="shopping-card">
            <h2>Add Shopping Item</h2>

            <form id="add-form">
                <div class="form-group">
                    <label for="name">Item Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="e.g. Injera"
                    >
                </div>

                <div class="form-group">
                    <label for="price">Price (ETB)</label>
                    <input
                        type="number"
                        id="price"
                        placeholder="e.g. 150"
                        min="1"
                    >
                </div>

                <button type="submit">Add Item</button>
            </form>

            <p id="message"></p>
        </section>

        <section class="shopping-card">
            <div class="list-header">
                <h2>Shopping List</h2>
                <p>Total: <strong id="total">0.00 ETB</strong></p>
            </div>

            <ul id="list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
